<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Contact - Green Camper</title>
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="/static/newstyles.css">
  </head>
  <body>
  <nav>
    <div class="logo_container">
      <div class="logo">Green Camper 🌲 <div class="small_logo">Since 1992</div>
      </div>
    </div>
    <div class="search">
      <form>
        <input type="text" placeholder="Search...">
      </form>
      <button type="submit">Go</button>
    </div>
    <ul class="menu">
      <li>
        <a href="./">Home</a>
      </li>
      <li>
        <a href="./products">Products</a>
      </li>
      <li>
        <a href="./login">Login</a>
      </li>
      <li>
        <a href="./cart">Cart</a>
      </li>
      <li>
        <a href="./contact">Contact</a>
      </li>
    </ul>
  </nav>
  <div class="item_page_container" >
    <img src="{{Img}}" width="350px">
    <div class="info">
    <h3>{{Name}}</h3>
    <p>ID : {{id}} </p>
    <p>Price : {{Price}}$ </p>
    <p>Category : Category</p>
    <p>Quantity : Quantity</p>
    <button>Add to Cart</button>
    
    </div>
    </div>
  </div>
  </div>
  <footer>
    <p>Green Camper - Since 1992</p>
  </footer>
  </body>
</html>
