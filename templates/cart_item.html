<div class="cart_item">
    <div class="cart_item_image">
        <img src="{{Image}}" width="80px">

    </div>
    <div class="cart_item_info">
        <div class="cart_item_text">
            <p>{{Name}} </p>
        </div>
        <div class="cart_item_price">
            <p>{{Price}}$</p>
        </div>
        <div class="cancel">
            <form action="/cart/{{id}}" method="post">
                <button>x</button>
            </form>
        </div>
    </div>
</div>
